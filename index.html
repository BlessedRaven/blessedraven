<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Blessed Raven — landing." />
  <meta name="theme-color" content="#ffffff" />
  <title>Blessed Raven</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="landing" id="top" aria-label="Blessed Raven">
    <canvas class="matrix" data-matrix aria-hidden="true"></canvas>
    <div class="mark" data-mark>
      <div class="mark-host" data-mark-host></div>
      <svg class="hits" viewBox="0 0 923.86 886.31" role="group" aria-label="Sigil links">
        <!-- Center stays still -->
        <a class="hotspot hotspot-center" data-sym="center" href="#" aria-label="Blessed Raven — home">
          <circle class="hit" cx="447.56" cy="484.96" r="155" />
          <text class="hit-label" x="447.56" y="484.96" text-anchor="middle" dy="0.35em">Home</text>
        </a>

        <!-- Outer hotspots track the orbit -->
        <g class="hits-orbit">
          <!-- N — crow → GitHub -->
          <a class="hotspot" href="https://github.com/BlessedRaven/blessedraven" data-sym="n" aria-label="GitHub" rel="noopener noreferrer" target="_blank">
            <circle class="hit" cx="453.56" cy="145" r="100" />
            <text class="hit-label" x="453.56" y="145" text-anchor="middle" dy="0.35em">GitHub</text>
          </a>
          <!-- NW -->
          <a class="hotspot is-soon" href="#soon" data-sym="nw" aria-label="Archive — coming soon">
            <circle class="hit" cx="148" cy="167" r="90" />
            <text class="hit-label" x="148" y="167" text-anchor="middle" dy="0.35em">Archive</text>
          </a>
          <!-- W -->
          <a class="hotspot is-soon" href="#soon" data-sym="w" aria-label="Orbit — coming soon">
            <circle class="hit" cx="91.8" cy="353" r="85" />
            <text class="hit-label" x="91.8" y="353" text-anchor="middle" dy="0.35em">Orbit</text>
          </a>
          <!-- SW -->
          <a class="hotspot is-soon" href="#soon" data-sym="sw" aria-label="Wings — coming soon">
            <circle class="hit" cx="90" cy="555" r="90" />
            <text class="hit-label" x="90" y="555" text-anchor="middle" dy="0.35em">Wings</text>
          </a>
          <!-- S — Fund placeholder (wire later) -->
          <a class="hotspot is-soon" href="#soon" data-sym="s" aria-label="Fund — coming soon">
            <circle class="hit" cx="462" cy="820" r="90" />
            <text class="hit-label" x="462" y="820" text-anchor="middle" dy="0.35em">Fund</text>
          </a>
          <!-- SE -->
          <a class="hotspot is-soon" href="#soon" data-sym="se" aria-label="Nest — coming soon">
            <circle class="hit" cx="672.71" cy="750.29" r="105" />
            <text class="hit-label" x="672.71" y="750.29" text-anchor="middle" dy="0.35em">Nest</text>
          </a>
          <!-- E -->
          <a class="hotspot is-soon" href="#soon" data-sym="e" aria-label="Lattice — coming soon">
            <circle class="hit" cx="821.16" cy="582.19" r="100" />
            <text class="hit-label" x="821.16" y="582.19" text-anchor="middle" dy="0.35em">Lattice</text>
          </a>
          <!-- NE -->
          <a class="hotspot is-soon" href="#soon" data-sym="ne" aria-label="Bloom — coming soon">
            <circle class="hit" cx="820.1" cy="342.59" r="100" />
            <text class="hit-label" x="820.1" y="342.59" text-anchor="middle" dy="0.35em">Bloom</text>
          </a>
        </g>
      </svg>
    </div>
    <p class="hint">Hover or tap a symbol</p>
    <p id="soon" class="soon" tabindex="-1">Coming soon.</p>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
