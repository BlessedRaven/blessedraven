<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="BlessedRaven — seed the nest. Live funds &amp; donations for inventions and prototypes." />
  <meta name="theme-color" content="#050506" />
  <title>BlessedRaven — Funds &amp; Donations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="fund-page">
  <div class="mesh" aria-hidden="true"><span class="mesh-ember"></span></div>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">
    <a class="logo" href="index.html">BlessedRaven</a>
    <div class="nav-right">
      <nav class="nav-filters" aria-label="Site">
        <a class="nav-chip" href="index.html">Inventions</a>
        <a class="nav-chip is-on" href="fund.html" aria-current="page">Fund</a>
      </nav>
    </div>
  </header>

  <main id="top" class="fund-page-main">
    <section class="fund-page-hero">
      <div class="fund-page-hero-inner">
        <p class="eyebrow reveal">Live funds</p>
        <h1 class="headline sm reveal" id="fund-headline">Seed the nest</h1>
        <p class="lede reveal" id="fund-lede"></p>

        <div class="fund-live reveal" id="fund-goal" hidden>
          <div class="fund-live-head">
            <div>
              <p class="fund-live-kicker">Progress</p>
              <p class="fund-live-label" id="fund-goal-label"></p>
            </div>
            <div class="fund-live-nums" id="fund-goal-nums"></div>
          </div>
          <div class="fund-live-rail" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="fund-rail" aria-label="Fundraising progress">
            <div class="fund-live-fill" id="fund-rail-fill"></div>
          </div>
          <p class="fund-live-meta">
            <span class="fund-live-badge">Manually updated</span>
            <span class="fund-live-note">Totals updated by hand until live payment webhooks.</span>
          </p>
        </div>
      </div>
    </section>

    <section class="fund-page-section" aria-labelledby="methods-heading">
      <div class="fund-page-section-inner">
        <h2 class="fund-page-h2 reveal" id="methods-heading">Ways to give</h2>
        <div class="fund-methods fund-page-methods reveal" id="fund-methods"></div>
      </div>
    </section>

    <section class="fund-page-section fund-page-projects-section" aria-labelledby="projects-heading">
      <div class="fund-page-section-inner">
        <h2 class="fund-page-h2 reveal" id="projects-heading">Back a project</h2>
        <p class="lede reveal fund-page-projects-lede">Jump to an invention on the gallery — then send via any method above.</p>
        <div class="fund-projects fund-page-projects reveal" id="fund-projects"></div>
      </div>
    </section>

    <section class="fund-page-footer">
      <div class="fund-page-section-inner">
        <p class="crow-line reveal">
          <a href="index.html">← Inventions</a>
          · <a href="https://github.com/BlessedRaven/blessedraven">GitHub</a>
          · brother crow keeps the ledger
        </p>
      </div>
    </section>
  </main>

  <noscript><p class="noscript">Enable JavaScript to load funding.json.</p></noscript>
  <script src="fund.js" defer></script>
</body>
</html>
